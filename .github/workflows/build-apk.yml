name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Hosted runners include the SDK. Only install packages when missing.
      - name: Ensure required Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          packages=()
          [[ -x "$SDK_ROOT/platform-tools/adb" ]] || packages+=("platform-tools")
          [[ -f "$SDK_ROOT/platforms/android-34/android.jar" ]] || packages+=("platforms;android-34")
          [[ -x "$SDK_ROOT/build-tools/34.0.0/aapt2" ]] || packages+=("build-tools;34.0.0")
          if (( ${#packages[@]} )); then
            SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMGR" --licenses > /dev/null || true
            "$SDKMGR" "${packages[@]}"
          fi

      # Build all required variants in one Gradle process. Tagged releases keep
      # using the persistent repo signing key configured in app/build.gradle.kts.
      - name: Build APKs and run unit tests
        run: |
          tasks=(assembleDebug testDebugUnitTest)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tasks+=(assembleRelease)
          fi
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1536m "${tasks[@]}" --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - name: Rename APK with version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/stikr.v${VERSION}.apk"
          # Stable filename: README links to this so version bumps never break the download.
          cp "app/build/outputs/apk/debug/stikr.v${VERSION}.apk" app/build/outputs/apk/debug/stikr.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stikr
          path: app/build/outputs/apk/debug/stikr*.apk

      - name: Rename signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SIGNED=$(ls app/build/outputs/apk/release/app-release*.apk | head -n 1)
          mv "$SIGNED" "app/build/outputs/apk/release/stikr.v${VERSION}.apk"
          # Stable filename: README links to this so version bumps never break the download.
          cp "app/build/outputs/apk/release/stikr.v${VERSION}.apk" app/build/outputs/apk/release/stikr.apk

      # On tags like v0.1, attach the APK to a GitHub Release so README can link it.
      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/stikr.v*.apk
            app/build/outputs/apk/release/stikr.apk
          generate_release_notes: true
