name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Hosted runners include the SDK. Only install packages when missing.
      - name: Ensure required Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          packages=()
          [[ -x "$SDK_ROOT/platform-tools/adb" ]] || packages+=("platform-tools")
          [[ -f "$SDK_ROOT/platforms/android-34/android.jar" ]] || packages+=("platforms;android-34")
          [[ -x "$SDK_ROOT/build-tools/34.0.0/aapt2" ]] || packages+=("build-tools;34.0.0")
          if (( ${#packages[@]} )); then
            SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMGR" --licenses > /dev/null || true
            "$SDKMGR" "${packages[@]}"
          fi

      - name: Build signed APK and run unit tests
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1536m assembleRelease testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - name: Prepare the download
        run: cp app/build/outputs/apk/release/app-release.apk stikr.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stikr
          path: stikr.apk

      - name: Update the single app download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view app > /dev/null 2>&1; then
            gh release create app --target "$GITHUB_SHA" --title "stikr" --notes "Download stikr.apk below. This download is updated automatically." --latest
          fi
          gh release upload app stikr.apk --clobber
          gh release edit app --title "stikr" --notes "Download stikr.apk below. Built from main commit $GITHUB_SHA. Install over the previous normal APK to keep your packs." --latest
